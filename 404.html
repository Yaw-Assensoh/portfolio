<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found | Yaw Assensoh Opoku</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Match index.html theme logic (prevents flash and respects manual toggle) -->
  <script>
    var t='light';
    try{t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){}
    document.documentElement.dataset.theme=t;
  </script>

  <style>
    /* Matched to index.html tokens */
    :root {
      --bg: #F8FAFC;
      --text: #374151;
      --head: #0D1117;
      --muted: #6B7280;
      --blue: #1B5FD9;
      --border: #E5E7EB;
      --radius: 8px;
    }
    
    html[data-theme="dark"] {
      --bg: #0B0F17;
      --text: #C7CDD8;
      --head: #F3F4F6;
      --muted: #9AA3B2;
      --blue: #3B7BEA;
      --border: #263041;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', system-ui, sans-serif;
      text-align: center;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .code {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: clamp(5rem, 22vw, 9rem);
      line-height: 1;
      color: var(--blue);
    }

    h1 {
      font-family: 'DM Serif Display', Georgia, serif;
      font-weight: 400;
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      color: var(--head);
      margin: 8px 0 12px;
    }

    p {
      max-width: 460px;
      margin: 0 auto 28px;
      color: var(--muted);
    }

    .row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    a {
      padding: 11px 22px;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: .9rem;
      text-decoration: none;
      border: 1.5px solid var(--blue);
      color: var(--blue);
      transition: all .2s;
    }

    a:hover, a:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(27, 95, 217, .25);
    }

    a.primary {
      background: var(--blue);
      color: #fff;
    }

    a:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 3px;
    }

    /* Skip link for accessibility */
    .skip {
      position: fixed;
      left: 12px;
      top: -60px;
      z-index: 100;
      background: var(--blue);
      color: #fff;
      padding: 10px 16px;
      border-radius: var(--radius);
      font-weight: 600;
      transition: top .2s;
    }
    .skip:focus { top: 12px; }

    /* Print styles */
    @media print {
      html[data-theme] { --bg: #fff; --text: #222; --head: #000; --muted: #444; --border: #ccc; --blue: #000; }
      .skip { display: none !important; }
      a { border: 1px solid #000; color: #000; }
      a.primary { background: #fff; color: #000; }
      a::after { content: " (" attr(href) ")"; font-size: .8em; word-break: break-all; }
    }
  </style>
  
  <!-- REPLACE YOUR-CODE WITH YOUR ACTUAL GOATCOUNTER CODE -->
  <script data-goatcounter="https://YOUR-CODE.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  
  <main id="main">
    <div class="code" aria-hidden="true">404</div>
    <h1>This page took a wrong turn</h1>
    <p>The link may be outdated or mistyped. The projects and case studies are all still on the main page.</p>
    <div class="row">
      <a class="primary" href="https://yaw-assensoh.github.io/portfolio/">Back to portfolio</a>
      <a href="https://yaw-assensoh.github.io/portfolio/#projects">See my projects</a>
      <a href="mailto:yaw.assensoh@hotmail.com">Email me</a>
    </div>
  </main>
</body>
</html>
